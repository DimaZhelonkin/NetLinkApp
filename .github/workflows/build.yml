name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0.0" buildozer wheel setuptools

      - name: Clean cache
        run: |
          rm -rf .buildozer/
          rm -rf ~/.buildozer/

      - name: Build APK with Force Python Flags
        run: |
          # Намертво привязываем внутренности buildozer к python3.11
          export P4A_hostpython=$(which python3)
          python3 -m buildozer -v android debug
