name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build with Buildozer
        run: buildozer -v android debug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          ANDROID_GRADLE_PLUGIN_VERSION: "8.1.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netlink-apk
          path: bin/*.apk
